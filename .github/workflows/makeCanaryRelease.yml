name: Make Canary Release

on:
  push:
    branches:
      - 'canary'
    paths:
      - '.github/edit2MakeNewCanary'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Source Code Download
      run: git clone --branch canary --single-branch --recurse-submodules ${{ github.server_url }}/${{ github.repository }}.git .
      
    - name: JDK 21 Setup
      uses: actions/setup-java@v5.2.0
      with:
        java-version: '21'
        distribution: 'jetbrains'
        cache: gradle

    - name: Gradlew Permissions
      run: chmod +x gradlew

    - name: Signature files preparation
      run: |
          if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> ReleaseKey.properties
            echo keyAlias='${{ secrets.ALIAS }}' >> ReleaseKey.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> ReleaseKey.properties
            echo storeFile='${{ github.workspace }}/ReleaseKey.jks' >> ReleaseKey.properties
            echo ${{ secrets.SIGNING_KEY }} | base64 --decode > ${{ github.workspace }}/ReleaseKey.jks
          fi
      
    - name: Gradle Build
      run: ./gradlew buildCanary -Pchannel=canary

    - name: Shell Scripts Permissions
      run: chmod +x .github/*.sh

    - name: Changelog Generation
      run: .github/extractCanaryChanges.sh

    - name: Version Bump
      run: .github/prepareCanaryChangelog.sh ${{ github.run_id }}

    - name: Upload Xposed Artifact to Actions
      uses: actions/upload-artifact@v4
      with: 
        name: PixelXpert-Canary.zip
        path: output

    - name: Push Canary Tags
      id: canary_version
      run: |
        VERSION=$(grep -i "VERSION_NAME" version.properties | cut -d '=' -f 2 | tr -d ' \r')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        git tag "$VERSION"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "$VERSION"
        git tag -f canary_builds
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git canary_builds --force

    - name: Canary Binary Release (Versioned)
      uses: ncipollo/release-action@v1.21.0
      with:
        tag: ${{ steps.canary_version.outputs.version }}
        name: 'PixelXpert ${{ steps.canary_version.outputs.version }}'
        bodyFile: changeLog.md
        prerelease: true
        allowUpdates: true
        replacesArtifacts: false
        draft: false
        artifacts: 'output/*.*'

    - name: Canary Binary Release (Latest Rolling)
      uses: ncipollo/release-action@v1.21.0
      with:
        tag: 'canary_builds'
        name: 'Latest Canary'
        omitBodyDuringUpdate: true
        prerelease: true
        allowUpdates: true
        replacesArtifacts: true
        draft: false
        artifacts: 'output/*.*'

    - name: Version Bump Commit
      uses: github-actions-x/commit@v2.9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        push-branch: 'canary'
        commit-message: 'Version update: Release'
        force-add: 'true'
        files: MagiskModBase/module.prop version.properties latestVersion.json CanaryChangelog.md latestCanary.json MagiskModuleUpdate_Xposed.json MagiskModuleUpdate_Full.json
        name: Codecity001
        email: sanganiharish263@gmail.com